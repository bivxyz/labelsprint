name: Import Avery templates

on:
  workflow_dispatch:
    inputs:
      skus:
        description: "Optional comma-separated SKUs; blank imports all current Coming soon records"
        required: false
        type: string
      dry_run:
        description: "Analyze and report without changing template data"
        required: true
        default: true
        type: boolean

concurrency:
  group: avery-template-import
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      AVERY_DOWNLOADABLES_ENDPOINT: ${{ vars.AVERY_DOWNLOADABLES_ENDPOINT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --only-binary=:all: --require-hashes --requirement tools/requirements.txt

      - name: Import official Avery PDFs
        env:
          INPUT_SKUS: ${{ inputs.skus }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--scope coming-soon --delay 0.5)
          if [ -n "$INPUT_SKUS" ]; then
            args+=(--sku "$INPUT_SKUS")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python tools/avery_template_import.py "${args[@]}"

      - name: Generate template consumers
        if: ${{ !inputs.dry_run }}
        run: npm run templates:generate

      - name: Verify importer and template geometry
        run: python -m unittest discover -s tools -p "test_*.py"

      - name: Verify generated files and production build
        if: ${{ !inputs.dry_run }}
        run: npm run lint

      - name: Stage fixed workflow outputs
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p workflow-output/data workflow-output/src workflow-output/workspace-extension
          cp data/avery-templates.json workflow-output/data/
          cp data/avery-template-import-report.json workflow-output/data/
          cp src/generatedAveryTemplates.js workflow-output/src/
          cp workspace-extension/TemplateCatalog.gs workflow-output/workspace-extension/

      - name: Upload import results
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avery-template-import-results-${{ github.run_id }}
          path: workflow-output
          if-no-files-found: error
          retention-days: 7

      - name: Upload dry-run report
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avery-template-import-report-${{ github.run_id }}
          path: artifacts/avery-template-import-report.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ !inputs.dry_run }}
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download validated generated files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: avery-template-import-results-${{ github.run_id }}
          path: workflow-output

      - name: Copy fixed generated files
        run: |
          cp workflow-output/data/avery-templates.json data/avery-templates.json
          cp workflow-output/data/avery-template-import-report.json data/avery-template-import-report.json
          cp workflow-output/src/generatedAveryTemplates.js src/generatedAveryTemplates.js
          cp workflow-output/workspace-extension/TemplateCatalog.gs workspace-extension/TemplateCatalog.gs

      - name: Create review branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/avery-templates.json src/generatedAveryTemplates.js workspace-extension/TemplateCatalog.gs; then
            echo "No newly calibrated templates were found."
            exit 0
          fi

          branch="automation/avery-template-import-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/avery-templates.json data/avery-template-import-report.json src/generatedAveryTemplates.js workspace-extension/TemplateCatalog.gs
          git commit -m "Import official Avery template geometry"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Import official Avery template geometry" \
            --body "Automated Avery PDF calibration run ${GITHUB_RUN_ID}. Review the generated geometry and attached workflow report before merging."
